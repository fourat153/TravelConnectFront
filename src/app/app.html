<p-toast>
  <ng-template let-message #message>
    <div class="toast-clickable-content" (click)="onToastClick(message)" style="cursor: pointer; width: 100%;">
      <div class="p-toast-message-text" style="display: flex; flex-direction: column; gap: 4px;">
        <span class="p-toast-summary" style="font-weight: 700;">{{ message.summary }}</span>
        <div class="p-toast-detail">{{ message.detail }}</div>
      </div>
    </div>
  </ng-template>
</p-toast>
<router-outlet />
