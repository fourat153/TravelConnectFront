<div class="friends-sidebar">

  <!-- Header -->
  <div class="sidebar-header">
    <span class="sidebar-title">Friends</span>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <p-iconfield styleClass="w-full">
      <p-inputicon class="pi pi-search" />
      <input
        pInputText
        type="text"
        placeholder="Search friends..."
        [(ngModel)]="searchQuery"
        (input)="onSearch()"
      />
    </p-iconfield>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="state-wrap">
    <p-progressSpinner strokeWidth="3" styleClass="w-8 h-8" />
  </div>

  <!-- Error -->
  <div *ngIf="!loading && error" class="state-wrap error">
    <i class="pi pi-exclamation-circle"></i> {{ error }}
  </div>

  <!-- Empty -->
  <div *ngIf="!loading && !error && filtered.length === 0" class="state-wrap">
    <i class="pi pi-inbox"></i> No friends found.
  </div>

  <!-- List -->
  <ng-container *ngIf="!loading && !error && filtered.length > 0">
    <div class="section-label">All Friends · {{ totalRecords }}</div>

    <div class="friends-list">
      <button
        *ngFor="let friend of filtered"
        class="friend-row"
        (click)="select(friend)"
      >
        <p-avatar
          *ngIf="friend.profile_picture; else initialAvatar"
          [image]="friend.profile_picture"
          shape="circle"
          styleClass="friend-avatar"
        />
        <ng-template #initialAvatar>
          <p-avatar
            [label]="initials(friend.username)"
            shape="circle"
            styleClass="friend-avatar"
          />
        </ng-template>
        <div class="friend-info">
          <span class="friend-name">{{ friend.username }}</span>
        </div>
      </button>
    </div>
  </ng-container>

  <!-- Paginator -->
  <div class="paginator-wrap" *ngIf="totalRecords > pageSize">
    <p-paginator
      [rows]="pageSize"
      [totalRecords]="totalRecords"
      [first]="(currentPage - 1) * pageSize"
      [rowsPerPageOptions]="[10, 20 , 30 , 40]"
      (onPageChange)="onPageChange($event)"
    />
  </div>

</div>
