<div class="login-page">

  <div class="hero-panel">
    <img src="images/loginimage.png" alt="" class="hero-bg-img" />
    <div class="hero-overlay"></div>

    <div class="hero-logo">
      <div class="hero-logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="#1abc9c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 3H3v4M19 3h2v4M5 21H3v-4M19 21h2v-4"/>
          <path d="M12 2C9.24 2 7 4.24 7 7c0 3.75 5 9 5 9s5-5.25 5-9c0-2.76-2.24-5-5-5z"/>
          <circle cx="12" cy="7" r="1.5" fill="#1abc9c" stroke="none"/>
        </svg>
      </div>
      <div class="hero-logo-text">TRAVEL<span>CONNECT</span></div>
    </div>

    <div class="hero-text">
      <h1>Discover <span>Trip</span><br>in Savan</h1>
      <p>Explore amazing places, connect with travelers, and create memories that last a lifetime.</p>
    </div>
  </div>

  <div class="form-panel">
    <div class="login-card">
      <div class="teal-bar"></div>
      <h2>Welcome Back</h2>
      <p class="subtitle">Sign in to continue your journey</p>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <input type="email" placeholder="Email" formControlName="username" />
        <input type="password" placeholder="Password" formControlName="password" />
        @if (errorMessage) {
          <p class="error">{{ errorMessage }}</p>
        }
        <button type="submit" [disabled]="isLoading">
          {{ isLoading ? 'Signing in...' : 'Sign In' }}
        </button>
      </form>
      <p class="register-link">
        Don't have an account? <a routerLink="/auth/register">Sign up</a>
      </p>
    </div>
  </div>

</div>
